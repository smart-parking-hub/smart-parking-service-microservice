plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'org.sonarqube' version '6.0.1.5171'
    id 'jacoco'
}

allprojects {
    group = 'com.smartparking'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.3.5'
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'com.h2database:h2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    apply plugin: 'jacoco'

    jacoco {
        toolVersion = "0.8.12"
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy 'jacocoTestReport'
    }

    tasks.named('jacocoTestReport') {
        dependsOn 'test'
        reports {
            xml.required = true
            csv.required = false
            html.required = true
        }
    }

    sonar {
        properties {
            property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.dir('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath}"
            property "sonar.coverage.exclusions", [
                "**/config/**",
                "**/*Application.java",
                "**/dto/**",
                "**/model/**",
                "**/enums/**",
                "**/infrastructure/security/AuthenticatedUser.java"
            ].join(",")
        }
    }

    pluginManager.withPlugin('org.springframework.boot') {
        tasks.named('jar') {
            enabled = false
        }
    }
}

sonar {
    properties {
        property "sonar.projectKey", "SmartParkingHub"
        property "sonar.projectName", "SmartParkingHub Microservices"
        property "sonar.host.url", System.getenv("SONAR_HOST_URL") ?: "http://localhost:9000"
        def token = System.getenv("SONAR_TOKEN") ?: (project.hasProperty("sonar.token") ? project.property("sonar.token") : "squ_84023b026d3de2492660f253645160fa27ca8f90")
        if (token) {
            property "sonar.token", token
            property "sonar.login", token
        }
        property "sonar.coverage.exclusions", [
            "**/config/**",
            "**/*Application.java",
            "**/dto/**",
            "**/model/**",
            "**/enums/**",
            "**/infrastructure/security/AuthenticatedUser.java"
        ].join(",")
        property "sonar.sourceEncoding", "UTF-8"
    }
}

