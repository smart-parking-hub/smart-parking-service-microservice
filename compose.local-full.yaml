# Full Local Integration Lab Overlay: includes Discovery Server (Eureka), Config Server, Kafka, Prometheus, and Grafana
services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: smart-parking-discovery
    restart: always
    ports:
      - "8761:8761"
    networks:
      - smart-parking-net

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: smart-parking-config
    restart: always
    ports:
      - "8888:8888"
    networks:
      - smart-parking-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smart-parking-kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - smart-parking-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: smart-parking-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - smart-parking-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: smart-parking-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - smart-parking-net
