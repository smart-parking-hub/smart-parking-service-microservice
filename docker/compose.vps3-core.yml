version: '3.8'

services:
  smart-parking-parkinglot:
    image: ghcr.io/${IMAGE_REPO:-smart-parking-hub}/parking-lot-service:latest
    container_name: smart-parking-parkinglot
    restart: always
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://116.118.6.107:3306/smart_parking_lot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${PARKING_DB_USERNAME:-parking_svc}
      DB_PASSWORD: ${PARKING_DB_PASSWORD:-SP_SecUser_Park2026_vT8!}
      REDIS_HOST: smart-parking-redis-core
    depends_on:
      - smart-parking-redis-core
    networks:
      - smart-parking-net

  smart-parking-booking:
    image: ghcr.io/${IMAGE_REPO:-smart-parking-hub}/booking-service:latest
    container_name: smart-parking-booking
    restart: always
    ports:
      - "8087:8083"
    environment:
      PORT: 8083
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://116.118.6.107:3306/smart_parking_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${BOOKING_DB_USERNAME:-booking_svc}
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:-SP_SecUser_Book2026_wR5!}
      REDIS_HOST: smart-parking-redis-core
      KAFKA_BOOTSTRAP_SERVERS: 116.118.6.107:9092
      PARKING_LOT_SERVICE_URL: http://smart-parking-parkinglot:8082
      PAYMENT_SERVICE_URL: http://116.118.6.107:8084
    depends_on:
      - smart-parking-redis-core
      - smart-parking-parkinglot
    networks:
      - smart-parking-net

  smart-parking-redis-core:
    image: redis:7.2-alpine
    container_name: smart-parking-redis-core
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - smart-parking-net

networks:
  smart-parking-net:
    name: smart-parking-net
    driver: bridge
