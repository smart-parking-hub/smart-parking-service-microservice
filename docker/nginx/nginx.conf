events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" trace_id="$http_x_correlation_id"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # Buffer & payload limits (prevent slowloris & large buffer exhaustion)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Anti-DDoS / Rate Limiting zones:
    # 1. api_limit: 25 requests/sec per IP, burst 50 (standard API protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=25r/s;
    # 2. auth_limit: 5 requests/sec per IP, burst 5 (anti-brute-force on login/register)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # Return 429 Too Many Requests instead of 503
    limit_req_status 429;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
