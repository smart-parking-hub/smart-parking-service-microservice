version: '3.8'

services:
  smart-parking-nginx:
    image: nginx:alpine
    container_name: smart-parking-nginx
    restart: always
    ports:
      - "80:80"
      # - "443:443" # Uncomment when SSL certbot is configured
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - smart-parking-net

  smart-parking-gateway:
    image: ghcr.io/${IMAGE_REPO:-smart-parking-hub}/api-gateway:latest
    container_name: smart-parking-gateway
    restart: always
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      PORT: 8088
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      IDENTITY_SERVICE_URL: http://smart-parking-identity:8081
      PARKING_LOT_SERVICE_URL: http://103.20.102.137:8082
      BOOKING_SERVICE_URL: http://103.20.102.137:8087
      PAYMENT_SERVICE_URL: http://116.118.6.107:8084
      NOTIFICATION_SERVICE_URL: http://116.118.6.107:8085
      AI_SERVICE_URL: http://116.118.6.107:8086
      SPRING_DATA_REDIS_HOST: smart-parking-redis-edge
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      - smart-parking-redis-edge
      - smart-parking-identity
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - smart-parking-net

  smart-parking-identity:
    image: ghcr.io/${IMAGE_REPO:-smart-parking-hub}/identity-service:latest
    container_name: smart-parking-identity
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PORT: 8081
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://116.118.6.107:3306/smart_parking_identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${IDENTITY_DB_USERNAME:-identity_svc}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-SP_SecUser_Iden2026_xM3!}
      NOTIFICATION_SERVICE_URL: http://116.118.6.107:8085
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:?APP_INTERNAL_SERVICE_TOKEN is required}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - smart-parking-net

  smart-parking-redis-edge:
    image: redis:7.2-alpine
    container_name: smart-parking-redis-edge
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - smart-parking-net

networks:
  smart-parking-net:
    name: smart-parking-net
    driver: bridge
