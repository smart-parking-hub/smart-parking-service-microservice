version: '3.8'

# VPS Large Expanded Profile: higher memory allowances, multiple replicas, and active distributed tracing
services:
  api-gateway:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  booking-service:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M

  payment-service:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
