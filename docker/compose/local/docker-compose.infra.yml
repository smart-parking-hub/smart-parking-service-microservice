name: docker

services:
  mysql:
    extends:
      file: compose.infra.yaml
      service: mysql
    volumes:
      - ../../../docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    extends:
      file: compose.infra.yaml
      service: redis

  kafka:
    extends:
      file: compose.kafka.yaml
      service: kafka
    environment:
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  prometheus:
    extends:
      file: compose.monitoring.yaml
      service: prometheus
    volumes:
      - ../../../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    extends:
      file: compose.monitoring.yaml
      service: grafana
    volumes:
      - ../../../docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

  sonarqube:
    extends:
      file: compose.quality.yaml
      service: sonarqube

networks:
  smart-parking-net:
    name: smart-parking-net
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  grafana_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
