name: docker

# Reusable local capability; see ../README.md for the supported combinations.
services:
  discovery-server:
    extends:
      file: docker/compose/local/compose.discovery.yaml
      service: discovery-server
    build:
      context: ./discovery-server
  config-server:
    extends:
      file: docker/compose/local/compose.discovery.yaml
      service: config-server
    build:
      context: ./config-server
  kafka:
    extends:
      file: docker/compose/local/compose.kafka.yaml
      service: kafka
  prometheus:
    extends:
      file: docker/compose/local/compose.monitoring.yaml
      service: prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    extends:
      file: docker/compose/local/compose.monitoring.yaml
      service: grafana
