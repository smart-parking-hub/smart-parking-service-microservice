name: docker

# Local Development Overlay: exposes ports to localhost and adds local databases
services:
  mysql:
    extends:
      file: docker/compose/local/compose.infra.yaml
      service: mysql
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    extends:
      file: docker/compose/local/compose.infra.yaml
      service: redis

  api-gateway:
    ports:
      - "8088:8088"
    depends_on:
      - identity-service
      - parking-lot-service
      - ai-service

  identity-service:
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  parking-lot-service:
    ports:
      - "8082:8082"
    volumes:
      - parking_lot_images:/app/uploads/parking-lot-images
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking-service:
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy

  notification-service:
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    ports:
      - "8086:8086"

volumes:
  mysql_data:
  redis_data:
  parking_lot_images:
