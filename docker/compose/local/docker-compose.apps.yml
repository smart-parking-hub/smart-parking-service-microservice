name: docker

services:
  api-gateway:
    build:
      context: ../../../api-gateway
      dockerfile: Dockerfile
    container_name: smart-parking-gateway
    restart: always
    ports:
      - "8088:8088"
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      PARKING_LOT_SERVICE_URL: http://parking-lot-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      AI_SERVICE_URL: http://ai-service:8086
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_CLIENT_ENABLED: "false"
    networks:
      - smart-parking-net

  identity-service:
    build:
      context: ../../../identity-service
      dockerfile: Dockerfile
    container_name: smart-parking-identity
    restart: always
    ports:
      - "8081:8081"
    environment:
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PORT: 8081
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://mysql:3306/smart_parking_identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
    networks:
      - smart-parking-net

  parking-lot-service:
    build:
      context: ../../../parking-lot-service
      dockerfile: Dockerfile
    container_name: smart-parking-parkinglot
    restart: always
    ports:
      - "8082:8082"
    environment:
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      BOOKING_SERVICE_URL: http://booking-service:8083
      PORT: 8082
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://mysql:3306/smart_parking_lot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
    networks:
      - smart-parking-net

  booking-service:
    build:
      context: ../../../booking-service
      dockerfile: Dockerfile
    container_name: smart-parking-booking
    restart: always
    ports:
      - "8083:8083"
    environment:
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      IDENTITY_SERVICE_URL: http://identity-service:8081
      PORT: 8083
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://mysql:3306/smart_parking_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PARKING_LOT_SERVICE_URL: http://parking-lot-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
    networks:
      - smart-parking-net

  payment-service:
    build:
      context: ../../../payment-service
      dockerfile: Dockerfile
    container_name: smart-parking-payment
    restart: always
    ports:
      - "8084:8084"
    environment:
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      BOOKING_SERVICE_URL: http://booking-service:8083
      APP_DEMO_PAYMENT_ENABLED: ${APP_DEMO_PAYMENT_ENABLED:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-dummy_client_id}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-dummy_api_key}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-dummy_checksum_key}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:3000/payment/return}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:3000/payment/cancel}
      PORT: 8084
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://mysql:3306/smart_parking_payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - smart-parking-net

  notification-service:
    build:
      context: ../../../notification-service
      dockerfile: Dockerfile
    container_name: smart-parking-notification
    restart: always
    ports:
      - "8085:8085"
    environment:
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME:-}}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      PORT: 8085
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://mysql:3306/smart_parking_notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - smart-parking-net

  ai-service:
    build:
      context: ../../../ai-service
      dockerfile: Dockerfile
    container_name: smart-parking-ai
    restart: always
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      PARKING_LOT_SERVICE_URL: http://parking-lot-service:8082
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    networks:
      - smart-parking-net

networks:
  smart-parking-net:
    external: true
