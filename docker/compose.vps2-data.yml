version: '3.8'

services:
  smart-parking-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smart-parking-kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://smart-parking-kafka:29092,PLAINTEXT_HOST://116.118.6.107:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@smart-parking-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"
    networks:
      - smart-parking-net

  smart-parking-payment:
    image: ghcr.io/${IMAGE_REPO:-smart-parking-hub}/payment-service:latest
    container_name: smart-parking-payment
    restart: always
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://116.118.6.107:3306/smart_parking_payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      KAFKA_BOOTSTRAP_SERVERS: smart-parking-kafka:29092
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-mock}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-mock}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-mock}
    depends_on:
      - smart-parking-kafka
    networks:
      - smart-parking-net

  smart-parking-notification:
    image: ghcr.io/${IMAGE_REPO:-smart-parking-hub}/notification-service:latest
    container_name: smart-parking-notification
    restart: always
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      EUREKA_CLIENT_ENABLED: "false"
      DB_URL: jdbc:mysql://116.118.6.107:3306/smart_parking_notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      KAFKA_BOOTSTRAP_SERVERS: smart-parking-kafka:29092
    depends_on:
      - smart-parking-kafka
    networks:
      - smart-parking-net

  smart-parking-ai:
    image: ghcr.io/${IMAGE_REPO:-smart-parking-hub}/ai-service:latest
    container_name: smart-parking-ai
    restart: always
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      PARKING_LOT_SERVICE_URL: http://103.20.102.137:8082
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    networks:
      - smart-parking-net

networks:
  smart-parking-net:
    name: smart-parking-net
    driver: bridge
