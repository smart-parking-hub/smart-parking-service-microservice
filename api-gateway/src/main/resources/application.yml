server:
  port: ${PORT:8088}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Identity Service
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/auth/**, /api/v1/users/**, /api/users/**, /api/v1/drivers/**, /api/drivers/**, /api/v1/merchants/**, /api/merchants/**, /api/v1/merchant/profile/**, /api/merchant/profile/**, /api/v1/vehicles, /api/v1/vehicles/**, /api/vehicles, /api/vehicles/**, /api/v1/admin/users, /api/v1/admin/users/**, /api/admin/users, /api/admin/users/**, /api/v1/admin/audit-logs, /api/v1/admin/audit-logs/**, /api/admin/audit-logs, /api/admin/audit-logs/**
          filters:
            - StripPrefix=0

        # Parking Lot Service
        - id: parking-lot-service
          uri: ${PARKING_LOT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/parking-lots, /api/v1/parking-lots/**, /api/parking-lots, /api/parking-lots/**, /api/v1/merchant/parking-lots, /api/v1/merchant/parking-lots/**, /api/merchant/parking-lots, /api/merchant/parking-lots/**, /api/v1/slots/**, /api/slots/**, /api/v1/pricing-rules/**, /api/pricing-rules/**, /api/v1/admin/parking-lots, /api/v1/admin/parking-lots/**, /api/admin/parking-lots, /api/admin/parking-lots/**
          filters:
            - StripPrefix=0

        # Booking Service
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/bookings, /api/v1/bookings/**, /api/bookings, /api/bookings/**, /api/v1/queues, /api/v1/queues/**, /api/queues, /api/queues/**, /api/v1/reviews, /api/v1/reviews/**, /api/reviews, /api/reviews/**, /api/v1/merchant/check-in/**, /api/merchant/check-in/**, /api/v1/merchant/check-out/**, /api/merchant/check-out/**, /api/v1/merchant/bookings, /api/v1/merchant/bookings/**
          filters:
            - StripPrefix=0

        # Payment Service
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/payments, /api/v1/payments/**, /api/payments, /api/payments/**, /api/v1/withdrawals, /api/v1/withdrawals/**, /api/withdrawals, /api/withdrawals/**, /api/v1/disputes, /api/v1/disputes/**, /api/disputes, /api/disputes/**, /api/v1/merchant/revenue, /api/v1/merchant/revenue/**, /api/merchant/revenue, /api/merchant/revenue/**, /api/v1/admin/withdrawals, /api/v1/admin/withdrawals/**, /api/admin/withdrawals, /api/admin/withdrawals/**, /api/v1/admin/transactions, /api/v1/admin/transactions/**, /api/admin/transactions, /api/admin/transactions/**, /api/v1/admin/dashboard, /api/v1/admin/dashboard/**, /api/admin/dashboard, /api/admin/dashboard/**
          filters:
            - StripPrefix=0

        # Notification Service
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications, /api/v1/notifications/**, /api/notifications, /api/notifications/**
          filters:
            - StripPrefix=0

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  secret: ${JWT_SECRET:smartparkingsecretkeymustbeverylongandsecure2026version}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
