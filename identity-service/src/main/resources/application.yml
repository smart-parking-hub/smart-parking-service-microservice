server:
  port: ${PORT:8081}

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:false}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:false}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      # Keep room for multipart framing. Identity enforces the file total separately.
      max-request-size: 17MB
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/smart_parking_identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: ${JWT_SECRET:smartparkingsecretkeymustbeverylongandsecure2026version}
  expiration-ms: 86400000 # 24h
  refresh-expiration-ms: 604800000 # 7 days

app:
  internal-service-token: ${APP_INTERNAL_SERVICE_TOKEN:}
  verification:
    casso:
      enabled: ${CASSO_TAX_LOOKUP_ENABLED:false}
      app-id: ${CASSO_APP_ID:}
      app-secret: ${CASSO_APP_SECRET:}
      timeout: ${CASSO_TAX_LOOKUP_TIMEOUT:5s}
      minimum-interval: ${CASSO_TAX_LOOKUP_MINIMUM_INTERVAL:3s}
    cloudinary:
      writes-enabled: ${KYC_CLOUDINARY_WRITES_ENABLED:false}
      cloud-name: ${KYC_CLOUDINARY_CLOUD_NAME:${CLOUDINARY_CLOUD_NAME:}}
      api-key: ${KYC_CLOUDINARY_API_KEY:${CLOUDINARY_API_KEY:}}
      api-secret: ${KYC_CLOUDINARY_API_SECRET:${CLOUDINARY_API_SECRET:}}

resilience4j:
  timelimiter:
    instances:
      otp-mail:
        timeout-duration: 6s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
