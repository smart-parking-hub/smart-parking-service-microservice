server:
  port: ${PORT:8081}

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:false}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:false}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/smart_parking_identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:smartparkingsecretkeymustbeverylongandsecure2026version}
  expiration-ms: 86400000 # 24h
  refresh-expiration-ms: 604800000 # 7 days

app:
  internal-service-token: ${APP_INTERNAL_SERVICE_TOKEN:}

resilience4j:
  timelimiter:
    instances:
      otp-mail:
        timeout-duration: 6s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
