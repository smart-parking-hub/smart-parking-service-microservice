spring:
  application:
    name: booking-service-test
  datasource:
    url: jdbc:h2:mem:booking_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: booking-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

services:
  parking-lot:
    url: http://localhost:8082
  payment:
    url: http://localhost:8084

jwt:
  secret: smartparkingsecretkeymustbeverylongandsecure2026version

app:
  booking:
    check-in-early-minutes: 30
    hold-policy:
      recheck-enabled: false
      rate-limit: 1000

eureka:
  client:
    enabled: false
