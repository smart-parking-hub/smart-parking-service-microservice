server:
  port: ${PORT:8083}

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:false}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:false}

spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/smart_parking_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: booking-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.smartparking.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

services:
  parking-lot:
    url: ${PARKING_LOT_SERVICE_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

app:
  booking:
    hold-policy:
      enabled: ${BOOKING_HOLD_POLICY_ENABLED:true}
      max-pending-per-account: ${BOOKING_HOLD_MAX_PENDING:3}
      abandonment-threshold: ${BOOKING_HOLD_ABANDONMENT_THRESHOLD:2}
      window-minutes: ${BOOKING_HOLD_WINDOW_MINUTES:5}
      cooldown-minutes: ${BOOKING_HOLD_COOLDOWN_MINUTES:5}
      rate-limit: ${BOOKING_HOLD_RATE_LIMIT:10}
      rate-window-seconds: ${BOOKING_HOLD_RATE_WINDOW_SECONDS:60}

resilience4j:
  timelimiter:
    instances:
      parking-lot-rpc:
        timeout-duration: 8s
      unpaid-hold-assessment:
        timeout-duration: 8s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
