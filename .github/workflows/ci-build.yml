name: CI Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release activation and failure contracts
        run: python -m unittest discover -s scripts/deploy/tests -v

  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable CI database only; migration tests create their own schemas.
          MYSQL_ROOT_PASSWORD: ci-only-mysql-root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-only-mysql-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ci-only-mysql-root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Run Unit & Integration Tests
        run: ./gradlew test --no-daemon

      - name: Verify payment recovery, hold policy and schedules on MySQL
        env:
          MYSQL_PWD: ${{ env.DB_PASSWORD }}
          HOLD_POLICY_MYSQL_TEST_PASSWORD: ${{ env.DB_PASSWORD }}
          PAYMENT_RECOVERY_MYSQL_TEST_PASSWORD: ${{ env.DB_PASSWORD }}
          HOLD_POLICY_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/booking_hold_policy_it?useSSL=false&allowPublicKeyRetrieval=true
          HOLD_MIGRATION_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/booking_hold_migration_it?useSSL=false&allowPublicKeyRetrieval=true
          PAYMENT_RECOVERY_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/payment_payos_recovery_it?useSSL=false&allowPublicKeyRetrieval=true
          PAYMENT_RECOVERY_MYSQL_MIGRATION_URL: jdbc:mysql://127.0.0.1:3306/payment_payos_migration_it?useSSL=false&allowPublicKeyRetrieval=true
          SCHEDULE_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:3306/sph_schedule_test_parking_ci?useSSL=false&allowPublicKeyRetrieval=true
          SCHEDULE_BOOKING_UPGRADE_JDBC_URL: jdbc:mysql://127.0.0.1:3306/sph_schedule_test_booking_ci?useSSL=false&allowPublicKeyRetrieval=true
          SCHEDULE_VEHICLE_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:3306/sph_schedule_test_vehicle_ci?useSSL=false&allowPublicKeyRetrieval=true
          SCHEDULE_TEST_DB_USER: ${{ env.DB_USERNAME }}
          SCHEDULE_TEST_DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          mysql --protocol=TCP --host=127.0.0.1 --user=root -e '
            CREATE DATABASE booking_hold_policy_it;
            CREATE DATABASE booking_hold_migration_it;
            CREATE DATABASE payment_payos_recovery_it;
            CREATE DATABASE payment_payos_migration_it;
            CREATE DATABASE sph_schedule_test_parking_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE sph_schedule_test_booking_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE sph_schedule_test_vehicle_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          ./gradlew :booking-service:test --tests '*UnpaidHoldPolicyIntegrationTest' --tests '*UnpaidHoldMigrationTest' --tests '*ScheduleMigrationMySqlTest' --tests '*VehicleBookingConflictIntegrationTest' :parking-lot-service:test --tests '*ScheduledReservationIntegrationTest' :payment-service:test --tests '*PaymentRecoveryIntegrationTest' --tests '*PaymentAttemptMigrationTest' --no-daemon --max-workers=2
