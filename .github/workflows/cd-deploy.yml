name: CI/CD Build & Deploy to 3 VPSs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build JARs & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build All Spring Boot JARs
        run: ./gradlew bootJar -x test --no-daemon

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Repository Prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker Images
        run: |
          services=("api-gateway" "identity-service" "parking-lot-service" "booking-service" "payment-service" "notification-service" "ai-service")
          for svc in "${services[@]}"; do
            echo "=================================================="
            echo "Building and pushing $svc..."
            echo "=================================================="
            docker build -t "$IMAGE_PREFIX/$svc:latest" "./$svc"
            docker push "$IMAGE_PREFIX/$svc:latest"
          done

  deploy-vps1:
    name: Deploy to VPS 1 (Edge & Gateway)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS 1 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS1_HOST }}
          port: ${{ secrets.VPS1_PORT || 2222 }}
          username: ${{ secrets.VPS1_USER }}
          password: ${{ secrets.VPS1_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            TARGET_DIR=~/smartparking
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            docker compose -f docker/compose.vps1-edge.yml pull
            docker compose -f docker/compose.vps1-edge.yml up -d --remove-orphans
            docker image prune -f

  deploy-vps2:
    name: Deploy to VPS 2 (Data & Async Services)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS 2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS2_HOST }}
          port: ${{ secrets.VPS2_PORT || 22 }}
          username: ${{ secrets.VPS2_USER }}
          password: ${{ secrets.VPS2_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            TARGET_DIR=~/smartparking
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            docker compose -f docker/compose.vps2-data.yml pull
            docker compose -f docker/compose.vps2-data.yml up -d --remove-orphans
            docker image prune -f

  deploy-vps3:
    name: Deploy to VPS 3 (Core Business Services)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS 3 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS3_HOST }}
          port: ${{ secrets.VPS3_PORT || 22 }}
          username: ${{ secrets.VPS3_USER }}
          password: ${{ secrets.VPS3_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            TARGET_DIR=~/smartparking
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            docker compose -f docker/compose.vps3-core.yml pull
            docker compose -f docker/compose.vps3-core.yml up -d --remove-orphans
            docker image prune -f
