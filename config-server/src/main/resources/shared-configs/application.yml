# Shared configuration served by Spring Cloud Config Server to all client microservices
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [trace_id=%X{X-Correlation-Id}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
