server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/shared-configs/
        git:
          uri: ${GIT_CONFIG_URI:https://github.com/example/smartparking-config-repo}
          clone-on-start: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
