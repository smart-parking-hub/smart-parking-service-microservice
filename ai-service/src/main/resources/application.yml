server:
  port: 8086

spring:
  application:
    name: ai-service

services:
  parking-lot-service:
    url: ${PARKING_LOT_SERVICE_URL:http://localhost:8082}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    temperature: 0.3
    max-tokens: 2048

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
