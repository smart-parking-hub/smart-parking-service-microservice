server:
  port: 8086

spring:
  application:
    name: ai-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

services:
  parking-lot-service:
    url: ${PARKING_LOT_SERVICE_URL:http://localhost:8082}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    temperature: 0.3
    max-tokens: 2048
    vision-read-timeout-ms: 25000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
