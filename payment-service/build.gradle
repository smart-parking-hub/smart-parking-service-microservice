plugins {
    id 'org.springframework.boot'
}

// Opt-in compatibility for the retained local database that already applied V6/V7.
// Preserve those released scripts byte-for-byte. V6 already creates the same outbox
// as canonical V16, so that one duplicate CREATE must not execute in this lineage.
// The canonical migration location and all its historical scripts stay unchanged.
tasks.named('processResources') {
    from('src/main/resources/db/migration') {
        into 'db/local-v6-v7-compatible'
        exclude 'V16__admin_operations_outbox.sql'
    }
    from('src/main/resources/db/local-v6-v7-history') {
        into 'db/local-v6-v7-compatible'
    }
}

dependencies {
    implementation project(':common-library')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'vn.payos:payos-java:2.0.1'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    testImplementation 'org.springframework.security:spring-security-test'
}
