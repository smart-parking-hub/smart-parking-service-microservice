server:
  port: ${PORT:8084}
  forward-headers-strategy: framework

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:false}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:false}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/smart_parking_payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB

payos:
  client-id: ${PAYOS_CLIENT_ID:your_payos_client_id}
  api-key: ${PAYOS_API_KEY:your_payos_api_key}
  checksum-key: ${PAYOS_CHECKSUM_KEY:your_payos_checksum_key}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

resilience4j:
  timelimiter:
    instances:
      dispute-booking:
        timeout-duration: 9s

app:
  payos-recovery-enabled: ${PAYOS_RECOVERY_ENABLED:true}
  storage:
    dispute-evidence-dir: ${DISPUTE_EVIDENCE_DIR:uploads/dispute-evidence}
