spring:
  application:
    name: payment-service-test
  datasource:
    url: jdbc:h2:mem:payment_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  kafka:
    admin:
      auto-create: false
    bootstrap-servers: 127.0.0.1:1
    listener:
      auto-startup: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

payos:
  client-id: dummy_client_id
  api-key: dummy_api_key
  checksum-key: dummy_checksum_key
  return-url: http://localhost:5173/payment/success
  cancel-url: http://localhost:5173/payment/cancel

jwt:
  secret: smartparkingsecretkeymustbeverylongandsecure2026version

app:
  admin-operations:
    enabled: false
  demo-payment-enabled: true
  platform:
    fee-percent: 10.0
  storage:
    dispute-evidence-dir: build/test-uploads/dispute-evidence

eureka:
  client:
    enabled: false

resilience4j:
  timelimiter:
    instances:
      dispute-booking:
        timeout-duration: 9s
