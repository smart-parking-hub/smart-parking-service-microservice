spring:
  application:
    name: payment-service-test
  datasource:
    url: jdbc:h2:mem:payment_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

payos:
  client-id: dummy_client_id
  api-key: dummy_api_key
  checksum-key: dummy_checksum_key
  return-url: http://localhost:5173/payment/success
  cancel-url: http://localhost:5173/payment/cancel

jwt:
  secret: smartparkingsecretkeymustbeverylongandsecure2026version

app:
  demo-payment-enabled: true
  platform:
    fee-percent: 10.0

eureka:
  client:
    enabled: false
